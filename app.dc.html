<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rolls">
<meta name="theme-color" content="#E8E1D3">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>Rolls</title>
<style>
  html, body { margin: 0; height: 100%; background: #E8E1D3; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  a { color: #8A6134; } a:hover { color: #5C4420; }
</style>
<script>
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); }); }
</script>
</helmet>
<div style="position:fixed; inset:0; background:#E8E1D3; overflow:hidden;">
  <dc-import name="Opening Screen" mode="{{ mode }}" variant="C" view="home" style="width:100%;height:100%;" hint-size="100%,100%"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: window.innerWidth };
  componentDidMount() { this._r = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this._r); }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() { return { mode: this.state.w >= 900 ? 'desktop' : 'mobile' }; }
}
</script>
</body>
</html>
